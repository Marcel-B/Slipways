server {
    listen 8080;
    root /usr/share/nginx/html;

    # Keine Zugriffsprotokolle mit IP-Adressen (siehe /datenschutz)
    access_log off;
    server_tokens off;
    include /etc/nginx/security-headers.conf;

    # Komprimiert Bundle und API-Antworten (die Gewässerformen sind ~200 KB), auch ohne Caddy davor.
    gzip on;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Looks the API up through Docker's DNS on every request (cached for 10 s) instead of once at start. Otherwise a
    # recreated API container with a new address, e.g. after "docker compose up -d api", leaves nginx at the old one
    # and every /api request fails with 502 until the web container restarts too.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api api:8080;

    location /api/ {
        proxy_pass http://$api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # The API builds the sitemap from the database.
    location = /sitemap.xml {
        proxy_pass http://$api/api/seo/sitemap;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The head of the requested page for the server side include in index.html. If the API cannot answer (rate limit,
    # restart), the response stays empty and index.html keeps its general title and description.
    location /seo-head/ {
        internal;
        rewrite ^/seo-head/(.*)$ /api/seo/head/$1 break;
        proxy_pass http://$api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 400 404 405 429 500 502 503 504 = @seo-head-fallback;
    }

    location @seo-head-fallback {
        return 204;
    }

    # Client-side routing: unknown paths serve the SPA. Server side includes put the title, description and
    # structured data of the requested page into index.html (see the block in web/index.html), so search engines
    # and link previews see them without running JavaScript.
    location / {
        ssi on;
        try_files $uri /index.html;
    }
}
