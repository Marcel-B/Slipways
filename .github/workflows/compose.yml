name: Compose

on:
  push:
    branches: [master]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build --detach --wait
      - name: API answers through the web container
        run: |
          curl --fail --silent --retry 30 --retry-all-errors --retry-delay 2 http://localhost:5080/health
          curl --fail --silent http://localhost:8080/api/slipways | jq 'length'
          curl --fail --silent --output /dev/null http://localhost:8080/
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
