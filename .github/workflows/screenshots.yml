name: App-Store-Screenshots

# Takes the screenshots for the App Store with the live data from slipways.de and keeps them as an artifact of the run.
# Uploading them to App Store Connect stays manual.
on:
  workflow_dispatch:
  pull_request:
    paths: [mobile/ios/SlipwaysScreenshots/**, mobile/ios/scripts/screenshots.sh, .github/workflows/screenshots.yml]

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v7
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Take screenshots
        run: scripts/screenshots.sh "$RUNNER_TEMP/screenshots"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Screenshots"
            find "$RUNNER_TEMP/screenshots" -name '*.png' | sort | while read -r file; do
              echo "- ${file#"$RUNNER_TEMP/screenshots/"} ($(sips -g pixelWidth -g pixelHeight "$file" | awk '/pixel/ {print $2}' | paste -sd x -))"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: app-store-screenshots
          path: |
            ${{ runner.temp }}/screenshots/**/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots-xcresult
          path: ${{ runner.temp }}/screenshots/*.xcresult
