# AUSLAUFEND: Die API schickt ihre Meldungen an Onkel Bummel (siehe deploy/README.md, „Benachrichtigungen“), diesen
# ntfy-Server braucht sie nicht mehr. Er bleibt nur, bis er auf slipways-1 abgeschaltet ist: dann die Datei aus
# COMPOSE_FILE in der .env streichen, "docker compose up -d --remove-orphans" ausführen (räumt den Container ab), die
# SLIPWAYS_NTFY_*-Zeilen löschen, "tailscale serve --https=2586 off" ausführen und diese Datei löschen.
# Solange sie in COMPOSE_FILE steht, muss sie im Repo bleiben, sonst schlägt docker compose fehl.
services:
  ntfy:
    image: binwiederhier/ntfy:v2
    command: serve
    environment:
      # Adresse, unter der die App den Server erreicht; ohne sie startet ntfy mit Upstream nicht
      NTFY_BASE_URL: ${SLIPWAYS_NTFY_BASE_URL:?SLIPWAYS_NTFY_BASE_URL fehlt in der .env}
      # Nur für iPhones: Apple stellt Push nur über ntfy.sh zu. ntfy.sh bekommt dabei nur einen Hash des Topics und
      # die ID der Nachricht, der Inhalt bleibt hier und wird von der App abgeholt.
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 72h
      NTFY_ENABLE_LOGIN: "false"
      TZ: Europe/Berlin
    ports:
      - "127.0.0.1:${SLIPWAYS_NTFY_PORT:-2586}:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"

volumes:
  ntfy-cache:
