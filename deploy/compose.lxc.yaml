# Betrieb auf einem Server (Produktion slipways.de, Test-Stage im Proxmox-LXC), ergänzt compose.yaml
# (eingebunden über COMPOSE_FILE in der .env im Repo-Root):
#   COMPOSE_FILE=compose.yaml:deploy/compose.lxc.yaml
# Werte stehen in der .env (im LXC legt sie deploy/proxmox/create-lxc.sh an).

# Container-Logs rotieren, damit Fehlermeldungen mit IP-Adressen nicht unbegrenzt liegen bleiben (siehe /datenschutz)
x-logging: &logging
  driver: local
  options:
    max-size: 5m
    max-file: "2"

services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: ${SLIPWAYS_ENVIRONMENT:-Production}
      TZ: Europe/Berlin
      # Logs an Loki, z. B. SLIPWAYS_LOKI_URL=http://monitoring:3100 und SLIPWAYS_MONITORING_HOST=slipways-1; leer: aus
      Monitoring__Loki__Url: ${SLIPWAYS_LOKI_URL:-}
      Monitoring__Loki__Host: ${SLIPWAYS_MONITORING_HOST:-unknown}
      # Push bei neuen Vorschlägen über ntfy, z. B. SLIPWAYS_NTFY_TOPIC=slipways-<zufall>; leer: aus.
      # Ohne Uhrzeiten sofort, sonst gesammelt, z. B. SLIPWAYS_NOTIFY_DAYS=Mo,Do und SLIPWAYS_NOTIFY_TIMES=18:00
      Notifications__BaseUrl: ${SLIPWAYS_NTFY_URL:-https://ntfy.sh/}
      Notifications__Topic: ${SLIPWAYS_NTFY_TOPIC:-}
      Notifications__Token: ${SLIPWAYS_NTFY_TOKEN:-}
      Notifications__ModerationUrl: ${SLIPWAYS_MODERATION_URL:-}
      Notifications__Days: ${SLIPWAYS_NOTIFY_DAYS:-}
      Notifications__Times: ${SLIPWAYS_NOTIFY_TIMES:-}
    # Nur lokal für Health-Check und Updater; von außen geht es über das Web unter /api.
    # /metrics und die Moderation nur lokal; ins Tailnet bringt sie "tailscale serve" (siehe deploy/README.md,
    # „Überwachung“ und „Moderation“).
    ports: !override
      - "127.0.0.1:${SLIPWAYS_API_PORT:-5080}:8080"
      - "127.0.0.1:${SLIPWAYS_METRICS_PORT:-9464}:9464"
      - "127.0.0.1:${SLIPWAYS_MODERATION_PORT:-9465}:9465"
    restart: unless-stopped
    logging: *logging

  web:
    ports: !override
      - "${SLIPWAYS_PORT:-8080}:8080"
    restart: unless-stopped
    logging: *logging
