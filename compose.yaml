# Local development stack: docker compose up --build
# Web: http://localhost:8080  API docs: http://localhost:5080/scalar
name: slipways

services:
  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Slipways: Data Source=/data/slipways.db
      DataProtection__KeysPath: /keys
    ports:
      - "5080:8080"
    volumes:
      - api-data:/data
      - api-keys:/keys

  web:
    build: ./web
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  api-data:
  api-keys:
