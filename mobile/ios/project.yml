name: Slipways
options:
  bundleIdPrefix: com.bvelop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SlipwaysKit:
    path: SlipwaysKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Slipways:
    type: application
    platform: iOS
    sources: [Slipways]
    dependencies:
      - package: SlipwaysKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bvelop.slipways
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Slipways
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_FILE: Slipways/Info.plist
      configs:
        # The simulator reaches the docker compose API on the host machine.
        Debug:
          SLIPWAYS_API_BASE_URL: http://localhost:5080
        Release:
          SLIPWAYS_API_BASE_URL: https://slipways.example.com
